# yaml-language-server: $schema=https://aka.ms/winget-manifest.singleton.1.6.0.schema.json
# Version, URL, nested path and SHA-256 are written by scripts/update-package-manifests.cjs.
PackageIdentifier: DeltaCLI.DeltaCLI
PackageVersion: 1.0.13
PackageName: Delta CLI
Publisher: Delta CLI
PublisherUrl: https://github.com/nile-agi/delta-release
PublisherSupportUrl: https://github.com/nile-agi/delta-release/issues
License: MIT
LicenseUrl: https://github.com/nile-agi/delta-release/blob/main/LICENSE
Copyright: Copyright (c) 2026 Nile AGI
CopyrightUrl: https://github.com/nile-agi/delta-release
ShortDescription: Offline AI Assistant powered by llama.cpp
Description: |
  Delta CLI is an open-source, offline-first AI assistant that runs large 
  language models (LLMs) directly on your device. Built on top of llama.cpp, 
  Delta CLI provides a simple command-line interface to interact with AI 
  models without requiring internet connectivity or cloud services.
  
  Features:
  - 100% Offline: Works completely offline after initial model download
  - High Performance: Full GPU acceleration (CUDA, Metal, Vulkan, ROCm)
  - Cross-Platform: Runs on desktop, mobile, and edge devices
  - Beautiful Terminal UI: Retro-green interface with custom styling
  - Easy Model Management: One-command downloads from Hugging Face
  - Zero-Setup: Auto-downloads default model on first run
  - Always Up-to-Date: Automatically uses the latest llama.cpp version
Tags:
  - ai
  - llm
  - machine-learning
  - offline
  - llama
  - cli
  - terminal
Moniker: delta
Commands:
  - delta
  - delta-server
Installers:
  - Architecture: x64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: delta-cli-1.0.13\bin\delta.exe
        PortableCommandAlias: delta
    # delta finds delta-server, llama-server and the web UI next to itself, so put the extracted
    # folder on PATH instead of linking the one executable somewhere else.
    ArchiveBinariesDependOnPath: true
    InstallerUrl: https://github.com/nile-agi/delta-release/releases/download/v1.0.13/delta-cli-windows-x64.zip
    InstallerSha256: 46D018C88A43AD8D2646C544245AA9268EF03F0902038751FCCBFF397E965153
ManifestType: singleton
ManifestVersion: 1.6.0
